<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | ÉLORA BEAUTY</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="login-page"><main class="login-box"><a class="brand" href="index.html">✿ ÉLORA<span> BEAUTY</span></a><h2>Que bom ter você aqui!</h2><p>Entre para agendar e fazer seus pedidos.</p><form id="formLogin"><input id="email" type="email" placeholder="Seu e-mail" required><input id="password" type="password" placeholder="Sua senha" required><button class="btn btn-primary" type="submit">Entrar</button></form><p id="msg"></p><p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p><p><a href="index.html">Voltar ao início</a></p></main><script>document.getElementById("formLogin").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("msg");try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.user.role==="seller"?"painel-vendedor.html":"pedidos.html"}catch(err){msg.textContent=err.message}})</script></body></html>
